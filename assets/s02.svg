<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" fill="none" role="img" aria-label="Section 02: SYSTEM MAP">
  <title>Section 02: SYSTEM MAP</title>
  <style>
    :root { --ink:#171717; --muted:#555555;
             --rule:#c4c4c4; --ghost:#b4b4b4; }
    text { font-family:Consolas,"Liberation Mono",monospace; letter-spacing:0; }
    .reveal { animation:reveal .7s ease; }
    .later { animation-delay:.15s; }
    .last { animation-delay:.3s; }
    .draw { animation:draw 1.3s ease; stroke-dasharray:1200; }
    .flow { stroke-dasharray:4 10; animation:flow 2s linear infinite; }
    .pulse { animation:pulse 2.8s ease-in-out infinite; }
    @keyframes reveal { from { opacity:.65; transform:translateY(6px); }
                         to { opacity:1; transform:translateY(0); } }
    @keyframes draw { from { stroke-dashoffset:150; } to { stroke-dashoffset:0; } }
    @keyframes flow { to { stroke-dashoffset:-28; } }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.45; } }
    @media (prefers-reduced-motion:reduce) {
      .reveal,.draw,.flow,.pulse { animation:none; }
    }
</style>
  <text x="48" y="72" font-size="52" fill="var(--ghost)" text-anchor="start">02</text>
  <text x="140" y="64" font-size="23" fill="var(--ink)" text-anchor="start" font-weight="700">SYSTEM MAP</text>
  <text x="952" y="64" font-size="16" fill="var(--muted)" text-anchor="end">~/02-ecosystem</text>
  <line x1="48" y1="92" x2="952" y2="92" stroke="var(--rule)" stroke-width="1" class="draw" />
</svg>

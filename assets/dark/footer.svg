<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" fill="none" role="img" aria-label="Shardul Funde: AI, backend engineering, and products; github.com/shardulfunde">
  <title>Shardul Funde: AI, backend engineering, and products; github.com/shardulfunde</title>
  <style>
    :root { --ink:#f0f0f0; --muted:#b5b5b5;
             --rule:#484848; --ghost:#767676; }
    text { font-family:Consolas,"Liberation Mono",monospace; letter-spacing:0; }
    .reveal { animation:reveal .7s ease; }
    .later { animation-delay:.15s; }
    .last { animation-delay:.3s; }
    .draw { animation:draw 1.3s ease; stroke-dasharray:1200; }
    .flow { stroke-dasharray:4 10; animation:flow 2s linear infinite; }
    .pulse { animation:pulse 2.8s ease-in-out infinite; }
    @keyframes reveal { from { opacity:.65; transform:translateY(6px); }
                         to { opacity:1; transform:translateY(0); } }
    @keyframes draw { from { stroke-dashoffset:150; } to { stroke-dashoffset:0; } }
    @keyframes flow { to { stroke-dashoffset:-28; } }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.45; } }
    @media (prefers-reduced-motion:reduce) {
      .reveal,.draw,.flow,.pulse { animation:none; }
    }
</style>
  <line x1="48" y1="24" x2="952" y2="24" stroke="var(--rule)" stroke-width="1" class="draw" />
  <circle cx="57" cy="66" r="4" fill="var(--ink)" class="pulse" />
  <text x="78" y="73" font-size="20" fill="var(--ink)" text-anchor="start">AI / BACKEND / PRODUCTS</text>
  <text x="952" y="73" font-size="20" fill="var(--muted)" text-anchor="end">@shardulfunde</text>
</svg>

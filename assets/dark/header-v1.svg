<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" fill="none" role="img" aria-label="Shardul Funde - AI &amp; ML student and backend developer">
  <title>Shardul Funde - AI &amp; ML student and backend developer</title>
  <style>
    :root { --ink:#f0f0f0; --muted:#b5b5b5;
             --rule:#484848; --ghost:#767676; }
    text { font-family:Consolas,"Liberation Mono",monospace; letter-spacing:0; }
    .reveal { animation:reveal .7s ease; }
    .later { animation-delay:.15s; }
    .last { animation-delay:.3s; }
    .draw { animation:draw 1.3s ease; stroke-dasharray:1200; }
    .flow { stroke-dasharray:4 10; animation:flow 2s linear infinite; }
    .pulse { animation:pulse 2.8s ease-in-out infinite; }
    @keyframes reveal { from { opacity:.65; transform:translateY(6px); }
                         to { opacity:1; transform:translateY(0); } }
    @keyframes draw { from { stroke-dashoffset:150; } to { stroke-dashoffset:0; } }
    @keyframes flow { to { stroke-dashoffset:-28; } }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.45; } }
    @media (prefers-reduced-motion:reduce) {
      .reveal,.draw,.flow,.pulse { animation:none; }
    }
</style>
  <text x="48" y="38" font-size="15" fill="var(--muted)" text-anchor="start">PROFILE / SHARDULFUNDE</text>
  <text x="952" y="38" font-size="15" fill="var(--muted)" text-anchor="end">SANGLI, INDIA</text>
  <line x1="48" y1="56" x2="952" y2="56" stroke="var(--rule)" stroke-width="1" class="draw" />
  <g class="reveal">
    <text x="46" y="154" font-size="76" fill="var(--ink)" text-anchor="start" font-weight="700">Shardul Funde</text>
    <text x="48" y="201" font-size="26" fill="var(--muted)" text-anchor="start">AI &amp; ML student / Backend developer</text>
  </g>
  <g class="reveal later">
    <text x="48" y="260" font-size="22" fill="var(--ink)" text-anchor="start">Python backends / AI-powered products / AI evaluation</text>
    <text x="48" y="296" font-size="21" fill="var(--muted)" text-anchor="start">StudyMate AI builder / National hackathon achievements</text>
  </g>
  <line x1="48" y1="328" x2="952" y2="328" stroke="var(--rule)" stroke-width="1" class="draw" />
  <text x="48" y="361" font-size="17" fill="var(--muted)" text-anchor="start">WALCHAND COLLEGE OF ENGINEERING</text>
  <text x="952" y="361" font-size="17" fill="var(--muted)" text-anchor="end">B.TECH AI &amp; ML / 2024 - 2028</text>
</svg>
